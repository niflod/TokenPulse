services:
  tokenpulse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tokenpulse
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY obrigatoria no .env com no minimo 32 caracteres}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - DATABASE_URL=sqlite+aiosqlite:///./data/dashboard.db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - PROVIDER_MONTHLY_BUDGET=${PROVIDER_MONTHLY_BUDGET:-}
      - GATEWAY_RATE_LIMIT_RPM=120
      - JWT_EXPIRATION_HOURS=24
      - LOG_RETENTION_DAYS=90
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
