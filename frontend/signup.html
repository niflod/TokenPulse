<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TokenPulse — Criar Conta</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --bg-app: #080A0F;
      --bg-card: #0D1118;
      --bg-input: #111827;
      --border-color: #1B2330;
      --border-focus: #4D8DFF;
      --text-main: #F5F7FA;
      --text-muted: #9AA4B2;
      --text-dim: #4D5A6E;
      --accent: #4D8DFF;
      --accent-hover: #3A7AEF;
      --ai-accent: #8B7CFF;
      --color-critical: #FF5C6C;
      --color-critical-bg: rgba(255, 92, 108, 0.15);
      --color-normal: #35D07F;
      --radius-md: 10px;
      --radius-lg: 14px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-app);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .signup-container {
      width: 100%;
      max-width: 440px;
      padding: 2rem;
    }

    .signup-logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .signup-logo h1 {
      font-size: 1.75rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--ai-accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .signup-logo p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 0.5rem;
    }

    .signup-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .signup-card h2 {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 0.9375rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(77, 141, 255, 0.12);
    }

    .btn-signup {
      width: 100%;
      padding: 0.75rem;
      margin-top: 0.5rem;
      background: linear-gradient(135deg, var(--accent), var(--ai-accent));
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-signup:hover {
      opacity: 0.92;
    }

    .btn-signup:active {
      transform: scale(0.99);
    }

    .btn-signup:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert-msg {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.8125rem;
      margin-bottom: 1.25rem;
      display: none;
    }

    .alert-error {
      background: var(--color-critical-bg);
      border: 1px solid var(--color-critical);
      color: var(--color-critical);
    }

    .alert-success {
      background: rgba(53, 208, 127, 0.15);
      border: 1px solid var(--color-normal);
      color: var(--color-normal);
    }

    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <div class="signup-logo">
      <h1><a href="/index.html" style="color: inherit; text-decoration: none;">⚡ TokenPulse</a></h1>
      <p>Observe your AI — Crie sua conta gratuita</p>
    </div>

    <div class="signup-card">
      <h2>Criar Nova Conta</h2>

      <div id="error-msg" class="alert-msg alert-error"></div>
      <div id="success-msg" class="alert-msg alert-success"></div>

      <form id="signup-form">
        <div class="form-group">
          <label for="signup-username">Nome de Usuário</label>
          <input type="text" id="signup-username" required autocomplete="username" placeholder="ex: dev_maria" minlength="3" maxlength="64" />
        </div>

        <div class="form-group">
          <label for="signup-email">E-mail</label>
          <input type="email" id="signup-email" required autocomplete="email" placeholder="seu@email.com" />
        </div>

        <div class="form-group">
          <label for="signup-password">Senha</label>
          <input type="password" id="signup-password" required autocomplete="new-password" placeholder="Mínimo de 8 caracteres" minlength="8" />
        </div>

        <button type="submit" id="signup-btn" class="btn-signup">Criar Conta</button>
      </form>

      <div class="auth-footer">
        Já tem uma conta? <a href="/login.html">Fazer Login</a>
        <div style="margin-top: 0.75rem; font-size: 0.8125rem;">
          <a href="/index.html" style="color: var(--text-dim); text-decoration: none;">← Voltar ao Início</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
